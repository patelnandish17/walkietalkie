<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle radar / sound waves in background -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="270" r="130" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="270" r="95" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="256" y1="95" x2="256" y2="145" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="85" r="14" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Walkie-talkie body / glowing speaker orb -->
  <circle cx="256" cy="270" r="80" fill="url(#orbGrad)" filter="url(#glow)"/>
  
  <!-- Inner Tactile Speaker Grille / Radio waves -->
  <circle cx="256" cy="270" r="54" fill="rgba(15,23,42,0.6)"/>
  <path d="M 235 245 C 235 235, 277 235, 277 245 C 277 265, 235 265, 235 285 C 235 295, 277 295, 277 305" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="270" r="6" fill="#38bdf8"/>
</svg>
